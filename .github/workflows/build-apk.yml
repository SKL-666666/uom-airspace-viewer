name: build-android-apk

# 云端构建 Android APK。
#
# 为什么在 CI 构建而不是本机：本机没有 Android SDK。
# GitHub Actions 的 ubuntu runner 自带 Android SDK 与 Gradle，
# 构建产物直接上传为 artifact，可从 Release 页面下载。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: 构建 release APK（未签名）
        working-directory: android
        run: |
          chmod +x gradlew || true
          # 没有 gradle-wrapper.jar，直接用 runner 上的 gradle
          gradle assembleRelease --no-daemon --stacktrace

      - name: 用 debug 密钥签名，方便直接安装
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "构建产物: $APK"
          # 生成一次性 debug keystore
          keytool -genkeypair -v -keystore uom.jks -storepass uomviewer \
            -keypass uomviewer -alias uom -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=UOM Viewer, OU=Dev, O=SKL, L=NA, ST=NA, C=CN" > /dev/null 2>&1
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks uom.jks \
            --ks-pass pass:uomviewer --key-pass pass:uomviewer \
            --out uom-viewer-signed.apk "$APK"
          $ANDROID_HOME/build-tools/$BT/apksigner verify uom-viewer-signed.apk && echo "签名校验通过"
          ls -la uom-viewer-signed.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: uom-viewer-apk
          path: android/uom-viewer-signed.apk
          if-no-files-found: error
